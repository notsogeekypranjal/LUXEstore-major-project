    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">LUXE</a>
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="Search products...">
                <button><i class="fas fa-search"></i></button>
            </div>
            
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#" class="active">Shop</a></li>
                    <li><a href="#">Collections</a></li>
                    <li><a href="#">About</a></li>

            <div class="icons">

                    <i class="fas fa-user"></i>

                </div>

                </div>
                <div class="menu-btn">
                    <i class="fas fa-bars"></i>

            </div>
        </div>
    </header>


    <section class="category-hero" style="background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80') no-repeat center center/cover;">
        <div class="container">
            <div class="hero-content">
                <h1>Electronics</h1>
                <p>Cutting-edge technology for your modern lifestyle</p>
            </div>
        </div>
    </section>

    <section class="subcategories">
        <div class="container">
            <h2 class="section-title">Shop by Category</h2>
            <div class="subcategory-grid">
                <a href="#" class="subcategory-card">
                    <img src="https://plus.unsplash.com/premium_photo-1679513691474-73102089c117?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8aGVhZHBob25lfGVufDB8fDB8fHww" alt="Audio">
                    <h3>Audio</h3>
                </a>
                <a href="#" class="subcategory-card">
                    <img src="https://plus.unsplash.com/premium_photo-1680985551009-05107cd2752c?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fHNtYXJ0cGhvbmV8ZW58MHx8MHx8fDA%3D" alt="Smartphones">
                    <h3>Smartphones</h3>
                </a>
                <a href="#" class="subcategory-card">
                    <img src="https://images.unsplash.com/photo-1611078489935-0cb964de46d6?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bGFwdG9wc3xlbnwwfHwwfHx8MA%3D%3D" alt="Laptops">
                    <h3>Laptops</h3>
                </a>
                <a href="#" class="subcategory-card">
                    <img src="https://images.unsplash.com/photo-1533139502658-0198f920d8e8?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8d2F0Y2hlc3xlbnwwfHwwfHx8MA%3D%3D" alt="Wearables">
                    <h3>Wearables</h3>
                </a>
            </div>
        </div>
    </section>

    <section class="products">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Featured Electronics</h2>
                <div class="sort-filter">
                    <select id="sort-by">
                        <option value="featured">Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="newest">Newest Arrivals</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>
            </div>
            
            <div class="product-grid" id="product-grid">
            </div>
        </div>
    </section>

 
    <section class="banner">
        <div class="container">
            <div class="banner-content">
                <h2>Tech Week Special</h2>
                <h3>25% Off</h3>
                <p>On select electronics</p>
                <a href="#" class="btn">Shop Now</a>
            </div>
        </div>
    </section>

   
    <footer class="footer">
        
    </footer>


    <div class="cart-sidebar" id="cart-sidebar">
  
    </div>
    <div class="cart-overlay" id="cart-overlay"></div>

   
    <div class="mobile-menu" id="mobile-menu">
       
    </div>

    <script src="script.js"></script>
    <script>
      
        document.addEventListener('DOMContentLoaded', () => {
            const electronicsProducts = products.filter(product => product.category === 'electronics');
            displayProducts(electronicsProducts);
            
           
            document.getElementById('sort-by').addEventListener('change', (e) => {
                let sortedProducts = [...electronicsProducts];
                
                switch(e.target.value) {
                    case 'price-low':
                        sortedProducts.sort((a, b) => a.price - b.price);
                        break;
                    case 'price-high':
                        sortedProducts.sort((a, b) => b.price - a.price);
                        break;
                    case 'newest':
                        sortedProducts.sort((a, b) => b.id - a.id);
                        break;
                    case 'rating':
                        sortedProducts.sort((a, b) => b.rating - a.rating);
                        break;
                    default:
                      
                        break;
                }
                
                displayProducts(sortedProducts);
            });
        });
    </script>
    <script src="shared.js"></script>
    <script src="products.js"></script>
   
</html>
