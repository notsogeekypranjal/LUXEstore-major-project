<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Fashion | LUXE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">LUXE</a>
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="Search products...">
                <button><i class="fas fa-search"></i></button>
            </div>
            
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#" class="active">Shop</a></li>
                    <li><a href="#">Collections</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
            
            <div class="icons">
                <div class="user-btn">
                    <i class="fas fa-user"></i>
                </div>
                <div class="wishlist-btn">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="cart-btn" id="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </div>
                <div class="menu-btn">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </header>

    <section class="category-hero" style="background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1483985988355-763728e1935b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80') no-repeat center center/cover;">
        <div class="container">
            <div class="hero-content">
                <h1>Women's Fashion</h1>
                <p>Elegant and stylish clothing for every occasion</p>
            </div>
        </div>
    </section>


    <section class="subcategories">
        <div class="container">
            <h2 class="section-title">Shop by Category</h2>
            <div class="subcategory-grid">
                <a href="#" class="subcategory-card">
                    <img src="https://plus.unsplash.com/premium_photo-1676236306466-25ba882070b3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8d29tZW4lMjBkcmVzc2VzfGVufDB8fDB8fHww" alt="Dresses">
                    <h3>Dresses</h3>
                </a>
                <a href="#" class="subcategory-card">
                    <img src="https://images.unsplash.com/photo-1631467697445-6c35d744187c?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8ZmVtYWxlJTIwdG9wc3xlbnwwfHwwfHx8MA%3D%3D" alt="Tops">
                    <h3>Tops</h3>
                </a>
                <a href="#" class="subcategory-card">
                    <img src="https://images.unsplash.com/photo-1581044777550-4cfa60707c03?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=686&q=80" alt="Jackets">
                    <h3>Jackets</h3>
                </a>
                <a href="#" class="subcategory-card">
                    <img src="https://plus.unsplash.com/premium_photo-1701000715852-ea0b75e90513?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8ZmVtYWxlJTIwYWNjZXNvcmllc3xlbnwwfHwwfHx8MA%3D%3D" alt="Accessories">
                    <h3>Accessories</h3>
                </a>
            </div>
        </div>
    </section>


    <section class="products">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Women's Collection</h2>
                <div class="sort-filter">
                    <select id="sort-by">
                        <option value="featured">Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="newest">Newest Arrivals</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>
            </div>
            
            <div class="product-grid" id="product-grid">
 
            </div>
        </div>
    </section>


    <section class="banner">
        <div class="container">
            <div class="banner-content">
                <h2>New Season Collection</h2>
                <h3>30% Off</h3>
                <p>On all women's fashion</p>
                <a href="#" class="btn">Shop Now</a>
            </div>
        </div>
    </section>


    <footer class="footer">

    </footer>

    <div class="cart-sidebar" id="cart-sidebar">

    </div>
    <div class="cart-overlay" id="cart-overlay"></div>


    <div class="mobile-menu" id="mobile-menu">

    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const womenProducts = products.filter(product => product.category === 'women');
            displayProducts(womenProducts);
       
            document.getElementById('sort-by').addEventListener('change', (e) => {
                let sortedProducts = [...womenProducts];
                
                switch(e.target.value) {
                    case 'price-low':
                        sortedProducts.sort((a, b) => a.price - b.price);
                        break;
                    case 'price-high':
                        sortedProducts.sort((a, b) => b.price - a.price);
                        break;
                    case 'newest':
                        sortedProducts.sort((a, b) => b.id - a.id);
                        break;
                    case 'rating':
                        sortedProducts.sort((a, b) => b.rating - a.rating);
                        break;
                    default:
                        
                        break;
                }
                
                displayProducts(sortedProducts);
            });
        });
    </script>
    <script src="shared.js"></script>
    <script src="products.js"></script>
    <script src="script.js"></script>
</body>
</html>
